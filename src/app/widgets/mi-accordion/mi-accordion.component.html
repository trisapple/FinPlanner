
   <ion-item (click)="toggleAccordion()">
      <ion-label class="ion-text-wrap">{{ name }}</ion-label>
      <ion-icon *ngIf="isMenuOpen" name="chevron-down"></ion-icon>
      <ion-icon *ngIf="!isMenuOpen" name="chevron-forward"></ion-icon>
   </ion-item>
   <ion-item [ngClass]="this.isMenuOpen ? 'active' : 'inactive'">
      <ion-label class="ion-text-wrap">{{ description }}</ion-label>
   </ion-item>
