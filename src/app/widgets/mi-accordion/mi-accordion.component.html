<h2 (click)="toggleAccordion()">
  {{ name }}
   <span *ngIf="isMenuOpen"><ion-icon name="chevron-down"></ion-icon></span>
   <span *ngIf="!isMenuOpen"><ion-icon name="chevron-forward"></ion-icon></span>
</h2>
<div [ngClass]="this.isMenuOpen ? 'active' : 'inactive'">
   <p>{{ description }}</p>
</div>
