<ion-header>
  <ion-toolbar>
    <ion-title>Finance</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- <div class="tradingview-widget-copyright"><a href="https://www.tradingview.com" rel="noopener" target="_blank"><span class="blue-text">Quotes</span></a> by TradingView</div> -->
  <iframe scrolling="no" allowtransparency="true" frameborder="0"
    src="https://s.tradingview.com/embed-widget/tickers/?locale=en#%7B%22symbols%22%3A%5B%7B%22proName%22%3A%22NASDAQ%3AMSFT%22%2C%22title%22%3A%22MSFT%22%7D%2C%7B%22proName%22%3A%22NASDAQ%3ATSLA%22%2C%22title%22%3A%22TSLA%20%22%7D%2C%7B%22proName%22%3A%22FX_IDC%3AEURUSD%22%2C%22title%22%3A%22EUR%2FUSD%22%7D%2C%7B%22proName%22%3A%22BITSTAMP%3ABTCUSD%22%2C%22title%22%3A%22BTC%2FUSD%22%7D%2C%7B%22proName%22%3A%22OANDA%3AUSDSGD%22%2C%22title%22%3A%22USD%2FSGD%22%7D%5D%2C%22colorTheme%22%3A%22dark%22%2C%22isTransparent%22%3Afalse%2C%22width%22%3A%22100%25%22%2C%22height%22%3A104%2C%22utm_source%22%3A%22www.tradingview.com%22%2C%22utm_medium%22%3A%22widget_new%22%2C%22utm_campaign%22%3A%22tickers%22%7D"
    style="box-sizing: border-box; height: calc(72px); width: 100%;"></iframe>
  <!-- </div> -->
  <br>
  <br>
  <div class="container">
    <img class="sky" src="../assets/stock1.jpg" style="width:100%">
    <div class="centered" style="color: white; font-size: 4vw; width:80%">Take Your First Step With Us Today</div>
  </div>
  <div>
    <ion-grid>
      <ion-row>
        <ion-col size-xs="12" size-md="4">
          <div>
            <ion-button expand="block" shape="round" (click)="stocks()">Stocks</ion-button>
          </div>
        </ion-col>
        <ion-col size-xs="12" size-md="4">
          <div>
            <ion-button expand="block" shape="round" (click)="fxrates()">Foreign Exchange</ion-button>
          </div>
        </ion-col>
        <ion-col size-xs="12" size-md="4">
          <div>
            <ion-button expand="block" shape="round" (click)="crypto()">Cryptocurrencies</ion-button>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <h1 style="text-align: center;"><strong>Top Headlines</strong></h1>
  <div>
    <ion-row>
      <ion-col size-xs="12" size-sm="6" size-md="12" *ngFor="let article of articles" (click)="onGoToNewsSinglePage(article)">
        <ion-card class="card">
          <ion-img class="list" [src]="article.urlToImage"></ion-img>
          <ion-row>
            <ion-col>
              <ion-card-header>
                <ion-card-title class="font">{{article.title}}</ion-card-title>
                <p>{{article.description}}</p>
              </ion-card-header>
            </ion-col>
          </ion-row>
        </ion-card>
      </ion-col>
    </ion-row>
  </div>
  <!-- </div> -->

  </div> -->
</ion-content>
