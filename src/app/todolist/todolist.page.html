<ion-header>
  <ion-toolbar>
    <ion-title>To-do List</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="addTodo()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list *ngFor="let each of todolistService.todoList">
    <!-- <ion-list-header>Test</ion-list-header> -->
    <ion-item>
      <ion-checkbox color="primary" slot="start"></ion-checkbox>
      <ion-label>
        <h2 *ngIf="each.name">{{ each.name }}</h2>
        <p *ngIf="each.dueDate.toDate()">{{ each.dueDate.toDate() }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
