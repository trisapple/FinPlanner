<ion-header>
  <ion-toolbar>
    <ion-title>To-do List</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-buttons *ngIf="userService.loggedin" slot="end">
      <ion-button (click)="addTodo()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list *ngFor="let each of todolistService.firetodoList; let i = index">
    <!-- <ion-list-header>Test</ion-list-header> -->
    <ion-item>
      <ion-checkbox [(ngModel)]="each.checked" (ionChange)="todocheck(each, i)" color="primary" slot="start"></ion-checkbox>
      <ion-label>
        <h2 *ngIf="each.name">{{ each.name }}</h2> <!-- Name -->
        <p *ngIf="each.dueDate.toDate()">{{ each.dueDate.toDate() }}</p> <!-- Due Date -->
      </ion-label>
      <ion-button (click)="updateTodo(each, i)">
        <ion-icon name="create"></ion-icon>
      </ion-button>
      <ion-button (click)="deleteTodo(i)">
        <ion-icon name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
