<ion-header>
  <ion-toolbar>
    <ion-title> {{coursesService.title}} </ion-title>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-row class="ion-justify-content-center">
    <ion-col size-xs="12" size-sm="12" size-md="12" size-lg="9">
      <div class="container">
        <img class="pic1" src="{{ coursesService.picture }}">
        <ion-text class="centered">{{coursesService.title}}</ion-text>
        <ion-text class="centered-1">These are the essential steps that you should take to set yourself up for success, no matter what your financial goals are.</ion-text>
      </div>
    </ion-col>
  </ion-row>

  <!-- <div class="cardview" *ngFor="let item of items"> -->
  <ion-col *ngIf='!onMobile'>
    <div class="cardview" *ngFor="let item of coursesService.lessons">
      <ion-card class="card">
        <iframe class="list" [src]="item.link | safe" frameborder="0"
          allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        <ion-row>
          <ion-col class="padding">
            <ion-card-header>
              <ion-card-subtitle>
                <ion-icon class="icon" name="videocam"></ion-icon>
                {{item.sub}}
              </ion-card-subtitle>
              <ion-card-title>{{item.head}}</ion-card-title>
            </ion-card-header>
            <ion-card-content>{{item.des}}</ion-card-content>
            <!-- <ion-card-content style="float: right;">{{item.time}}</ion-card-content> -->
          </ion-col>
        </ion-row>
        <ion-row class="duration">
          <ion-col>
            <ion-card-content style="float: right;">{{item.time}}</ion-card-content>
          </ion-col>
        </ion-row>
      </ion-card>
    </div>
  </ion-col>

  <ion-col *ngIf='onMobile'>
    <div class="cardview" *ngFor="let item of coursesService.lessons">
      <ion-card class="card" (click)="gotolink(item.link)">
        <ion-row>
          <ion-col class="padding">
            <ion-card-header>
              <ion-card-subtitle>
                <ion-icon class="icon" name="videocam"></ion-icon>
                {{item.sub}}
              </ion-card-subtitle>
              <ion-card-title>{{item.head}}</ion-card-title>
            </ion-card-header>
            <ion-card-content>{{item.des}}</ion-card-content>
            <ion-card-content style="float: right;margin-top: 50px;">{{item.time}}</ion-card-content>
          </ion-col>
        </ion-row>
      </ion-card>
    </div>
  </ion-col>

</ion-content>
