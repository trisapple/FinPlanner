<ion-header>
  <ion-toolbar>
    <ion-title>Investing Basics</ion-title>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container">
    <img class ="pic1" src="../assets/invest.jpg" alt="Learn" style="width:80%">
    <div class="centered">Invest Basics</div>
    <div class="centered-1">With all the investment advice and options out there, it can be hard to decide how to start investing. But once you know what to look for, you can make investing decisions with confidence.</div>
  </div>



  <div class="cardview" *ngFor="let item of items">
    
    <ion-col>
      <ion-card class="card">
        <iframe class="list" height="300px" [src]="item.vid"  frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        <ion-row>
          <ion-col class="padding">
            <ion-card-header>
              <ion-card-subtitle>
                <ion-icon class="icon" name="videocam"></ion-icon>
                {{item.sub}}
              </ion-card-subtitle>
              <ion-card-title>{{item.head}}</ion-card-title>
            </ion-card-header>
            <ion-card-content>{{item.des}}</ion-card-content>
            <ion-card-content style="float: right;margin-top: 50px;">{{item.time}}</ion-card-content>
          </ion-col>
        </ion-row>
      </ion-card>
    </ion-col>
  </div>
  
</ion-content>
