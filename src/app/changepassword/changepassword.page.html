<ion-header>
  <ion-toolbar>
    <ion-title>Forgot Password</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-row class="row">
    <div>
      <ion-text>
        <h2 no-margin margin-vertical text-center>Change Password</h2>
      </ion-text>
    </div>
  </ion-row>
  <ion-row>
    <ion-col>
      <ion-text>Enter your new password</ion-text>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
      <ion-input clearInput type="password" placeholder="New Password" [(ngModel)]="newPassword" class="input" padding-horizontal
        clear-input="true"></ion-input>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
      <ion-input clearInput type="password" placeholder="Confirm Password" [(ngModel)]="confirmPassword" class="input" padding-horizontal
        clear-input="true"></ion-input>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
      <ion-button expand="block" (click)="changePassword()" class="transition">
        <strong class="white">
          Change Password</strong></ion-button>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
      <ion-text class="error" text-center>{{error}}</ion-text>
    </ion-col>
  </ion-row>
</ion-content>
