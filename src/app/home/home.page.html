<ion-header>
  <ion-toolbar>
    <ion-title>Home</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    
  </ion-toolbar>

</ion-header>

<ion-content class="ion-padding">
  <!-- <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header> -->

  <ion-button (click)=citiconnect()>Connect to Citi</ion-button>
  <ion-button (click)=dbsconnect()>Connect to DBS</ion-button>
  <br><br>
  <ion-text>Authorisation Code</ion-text>
  <br><br>
  <ion-text>{{ userService.authorisationCode }}</ion-text>
  <br><br>
  <ion-text>Access Token</ion-text>
  <br><br>
  <ion-text>{{ userService.accessToken }}</ion-text>
  <br><br>
  <!-- <ion-button (click)=codes()>Get Codes</ion-button> -->

  <ion-grid>
    <ion-row>
      <ion-col>
        <div>
          1 of 2
        </div>
      </ion-col>
      <ion-col>
        <div>
          2 of 2
        </div>
      </ion-col>
    </ion-row>
    <ion-row *ngFor="let each of userService.transactions">
      <ion-col>
        <div>
          {{ each.transactionDescription }}
        </div>
      </ion-col>
      <ion-col>
        <div>
          {{ each.transactionAmount }}
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
