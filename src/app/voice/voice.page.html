<ion-header>
  <ion-toolbar>
    <ion-title>Voice Enrolment & Verification</ion-title>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="statusCheck">
    <br><br>
    <ion-label class="center">Checking status...</ion-label>
  </div>
  <div *ngIf="noDataReturned">
    <br><br>
    <ion-label class="center">VoicePrint API returned no data.</ion-label>
  </div>
  <br><br>
  <ion-label class="center" *ngIf="!isVoiceEnrolled">Voice Enrolled: No</ion-label>
  <ion-label class="center" *ngIf="isVoiceEnrolled">Voice Enrolled: Yes</ion-label>
  <br><br>
  <ion-button (click)="enrollVoice()" expand="block" class="button"><b>Enroll Voice</b></ion-button>
  <br><br>
  <ion-button (click)="recordAudio()" expand="block" class="button"><b>Record Audio</b></ion-button>
  <br>
  <ion-label class="center"><i>*Please record for at least 20 seconds</i></ion-label>
  <br>
  <ion-button (click)="verifyAudio()" expand="block" class="button"><b>Verify Voice</b></ion-button>
  <br><br>
  <ion-button (click)="deleteAudio()" expand="block" class="button"><b>Unenroll Voice</b></ion-button>
  <br><br>
  
</ion-content>
