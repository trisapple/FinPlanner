<ion-header>
  <ion-toolbar>
    <ion-title>FAQ</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="gotoaskques()">
        Ask Question
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1 style="text-align: center;"><b>FAQ (Frequently Asked Questions)</b></h1>
  <!-- 
  <ion-list>
    <ion-item>
      <ion-label> -->
  <!-- <ion-list>
    <app-mi-accordion *ngFor="let item of items" name="{{ item.name }}" description="{{ item.description }}" class="hover">
    </app-mi-accordion>
  </ion-list> -->
  <!-- </ion-label>
    </ion-item>
  </ion-list> -->

  <div *ngFor="let item of items" (click)="expandItem(item)">
    <ion-item>
      <ion-label class="ion-text-wrap">{{ item.name }}</ion-label>
      <ion-icon *ngIf="item.expanded" name="chevron-down"></ion-icon>
      <ion-icon *ngIf="!item.expanded" name="chevron-forward"></ion-icon>
    </ion-item>
    <app-expandable expandHeight="400px" [expanded]="item.expanded">
      <ion-item>
        <ion-label class="ion-text-wrap">{{ item.description }}</ion-label>
      </ion-item>
    </app-expandable>
  </div>

  <!-- <ion-button style="margin-top: 40px;" (click)="gotoaskques()">Ask Question</ion-button> -->
</ion-content>
