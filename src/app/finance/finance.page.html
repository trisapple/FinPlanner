<ion-header>
  <ion-toolbar>
    <ion-title>Finance</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button style="--color: white" (click)="rates()"> 
        Stocks
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

      <ion-grid>
        <ion-row>
          <ion-col>
            <div class="container">
              <ion-row>
                <ion-col size-xs="12" size-sm="6" size-md="4" size-lg="12" *ngFor="let article of newsService.articles">
                  <ion-card class="card" href="{{article.url}}" target="_blank">
                    <ion-img class="list" [src]="article.urlToImage"></ion-img>
                    <ion-row>
                      <ion-col>
                        <ion-card-header>
                          <ion-card-title class="font">{{article.title}}</ion-card-title>
                          <p>{{article.description}}</p>
                        </ion-card-header>
                      </ion-col>
                    </ion-row>
                  </ion-card>
                </ion-col>
              </ion-row>
            </div>
          </ion-col>
