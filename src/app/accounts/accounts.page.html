<ion-header>
  <ion-toolbar>
    <ion-title>Bank Accounts</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>
    <!-- Accounts -->
    <div *ngFor="let each of expensesService.saltedgeconnections">
      <ion-item>

        <ion-label (click)="gotoAccounts(each)">
          <h2>{{ each.provider_name }}</h2> <!-- Bank Name -->
          <p>Last Synced: {{ each.last_success_at }}</p> <!-- Last Synced Date and Time -->
        </ion-label>
        <!-- Reconnect Bank -->
        <ion-button (click)="reconnect(each.id)">
          <ion-icon name="sync"></ion-icon>
        </ion-button>
        <!-- Delete Bank -->
        <ion-button (click)="deleteconnection(each.id)" style="margin-right: 16px;">
          <ion-icon name="trash"></ion-icon>
        </ion-button>

        <ion-icon name="chevron-forward"></ion-icon>
      </ion-item>
    </div>

    <!-- Connect Bank Account -->
    <ion-item (click)=createconnection()>
      <ion-icon style="margin-right: 16px" name="add"></ion-icon>
      <ion-label>
        <h2>Connect Bank Account</h2>
      </ion-label>
    </ion-item>

  </ion-list>
</ion-content>
