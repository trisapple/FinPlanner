<ion-header>
  <ion-toolbar>
    <ion-title>Savings Suggestions</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-label class = "suggestions">
    Savings Suggestions recommended for you:
  </ion-label>

  <ion-card class = "ion-padding">
    <ion-card-header style = "font-size: 20px;">
      <b>Lifestyle</b>
    </ion-card-header>

    <ion-card-content>
      Limit grab to once a week
    </ion-card-content>

    <ion-card-content>
      You can cut down by <b>10%</b>
    </ion-card-content>
  </ion-card>

  <ion-card class = "ion-padding">
    <ion-card-header style = "font-size: 20px;">
      <b>Recurring Fees</b>
    </ion-card-header>

    <ion-card-content>
      Limit shopping to only once a week
    </ion-card-content>

    <ion-card-content>
      You can cut down by <b>20%</b>
    </ion-card-content>
  </ion-card>

</ion-content>
