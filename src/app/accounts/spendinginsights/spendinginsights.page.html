<ion-header>
  <ion-toolbar>
    <ion-title>Spending Insights for {{ expensesService.transactionhistorytitle }}</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <!-- Pie Chart from Google Charts -->
  <div *ngIf="expensesService.ocbcCreditCardTransaction">
    <google-chart *ngIf="expensesService.pieChart" [data]="expensesService.pieChart"></google-chart>

    <ion-text>Top Expenses</ion-text>

    <ion-grid>
      <!-- Loop through the array and display the expenses -->
      <div *ngFor="let i of expensesService.pieChartData2">
        <ion-row style="margin-top: 6px;">
          <ion-text>{{ i[0] }}</ion-text>
        </ion-row>
        <ion-row style="margin-top: 6px;">
          <ion-text>{{ i[1].toLocaleString('en-SG', { style: 'currency', currency: 'SGD' }) }}</ion-text>
        </ion-row>
        <ion-row style="margin-top: 6px;">
          <ion-progress-bar [value]="i[1]/expensesService.total"></ion-progress-bar>
        </ion-row>
        <br>
      </div>
    </ion-grid>
    <ion-button expand = "block">View Savings Suggestions</ion-button>
  </div>
  <ion-label *ngIf="!expensesService.ocbcCreditCardTransaction" style = "font-size: 20px" class="ocbc">
    No Spending Insights
  </ion-label>

</ion-content>
