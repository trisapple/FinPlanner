<ion-header>
  <ion-toolbar>
    <ion-title>Spending Insights for {{ expensesService.transactionhistorytitle }}</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Pie Chart from Google Charts -->
  <div *ngIf="expensesService.transactions && expensesService.transactions.length > 0">
    <div style="height: 300px;">
      <canvas #doughnutCanvas></canvas>
    </div>

    <ion-grid>
      <!-- Loop through the array and display the expenses -->
      <div *ngFor="let i of expensesService.pieChartData">
        <ion-row style="margin-top: 6px;">
          <ion-text>{{ i[0] }}</ion-text> <!-- Category -->
        </ion-row>
        <ion-row style="margin-top: 6px;">
          <ion-text>{{ i[2] }} ({{ i[3] }}%)</ion-text> <!-- Percentage of total expenses -->
        </ion-row>
        <ion-row style="margin-top: 6px;">
          <ion-progress-bar [value]="i[1]/expensesService.total"></ion-progress-bar> <!-- Percentage as Progress Bar -->
        </ion-row>
        <br>
      </div>
    </ion-grid>
    <ion-button expand="block" (click)="view()">View Savings Suggestions</ion-button>
  </div>
  <ion-label *ngIf="!expensesService.transactions || expensesService.transactions.length == 0" style="font-size: 20px" class="ocbc">
    No Spending Insights
  </ion-label>

</ion-content>
