<ion-header>
  <ion-toolbar>
    <ion-title>Transaction History for {{ expensesService.transactionhistorytitle }}</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>

    <!-- Header Row -->
    <ion-row *ngIf="expensesService.transactions && expensesService.transactions.length != 0">
      <ion-col size-xs="3" size-md="2">
        <div>
          Date
        </div>
      </ion-col>
      <ion-col size-xs="3" size-md="4">
        <div>
          Category
        </div>
      </ion-col>
      <ion-col size-xs="3" size-md="4">
        <div>
          Description
        </div>
      </ion-col>
      <ion-col size-xs="3" size-md="2">
        <div>
          Amount
        </div>
      </ion-col>
    </ion-row>

    <!-- Loop through the list of transactions, displaying the date, description and amount -->
    <ion-row *ngFor="let each of expensesService.transactions">
      <ion-col size-xs="3" size-md="2">
        <div>
          {{ each.made_on }}
        </div>
      </ion-col>
      <ion-col size-xs="3" size-md="4">
        <div>
          {{ each.category }}
        </div>
      </ion-col>
      <ion-col size-xs="3" size-md="4">
        <div>
          {{ each.description }}
        </div>
      </ion-col>
      <ion-col size-xs="3" size-md="2">
        <div>
          {{ (each.amount) }}
        </div>
      </ion-col>
    </ion-row>  
    <ion-label *ngIf="!expensesService.transactions || expensesService.transactions.length == 0" style = "font-size: 20px" class="ocbc">
      No Transaction History
    </ion-label>
  </ion-grid>
</ion-content>
