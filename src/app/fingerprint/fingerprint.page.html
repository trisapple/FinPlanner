<ion-header *ngIf="!isModal">
  <ion-toolbar>
    <ion-title>Login with Fingerprint or Face ID</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-content>
    <ion-row class="login-row ion-align-items-center"> 
      <ion-col size="5"></ion-col>
      <ion-col class="lock-col">
      <div class="lock-bg"></div>
      <img button src="assets/lock.png" class="lock-img" (click)="login()">
    </ion-col>
    <ion-col size="5"></ion-col>
    </ion-row>
  </ion-content>

</ion-content>
