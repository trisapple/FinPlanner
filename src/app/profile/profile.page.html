<ion-header>
  <ion-toolbar>
    <ion-title>Profile</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-row>
    <img width="64" height="64" src="assets/avatar.png">
    <ion-col class="verticalcenter truncate">
      <ion-text style="width: 100%;">
        <ion-row>
          <h4 class="truncate" style="margin-bottom: 4px; margin-top: 0px;">{{userService.firstname}} {{userService.lastname}}</h4>
        </ion-row>
        <ion-row>
          <span class="truncate" style="font-size: 12px">{{userService.email}}</span>
        </ion-row>
        <!-- <ion-row>
          <h4 class="truncate" style="margin-bottom: 4px; margin-top: 0px;">FirstName LastName</h4>
        </ion-row>
        <ion-row>
          <span class="truncate" style="font-size: 12px">email@email.com</span>
        </ion-row> -->
      </ion-text>
    </ion-col>
  </ion-row>
  <br>
  <ion-button class="transition">Edit User Information</ion-button>
  <br>
  <ion-button class="transition">Change Password</ion-button>
</ion-content>
