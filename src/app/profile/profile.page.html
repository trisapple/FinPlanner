<ion-header>
  <ion-toolbar>
    <ion-title>Profile</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-row>
    <img width="64" height="64" src="assets/avatar.png">
    <ion-col class="verticalcenter" style="width: 100%; overflow:hidden; text-overflow: ellipsis; white-space: nowrap;">
      <ion-text style="width: 100%;">
        <h5 style="margin: 0px;">{{userService.firstname}} {{userService.lastname}}</h5>
        
        <span style="font-size: 12px; overflow:hidden; text-overflow: ellipsis; white-space: nowrap;">{{userService.email}}</span>
      </ion-text>
    </ion-col>
  </ion-row>
  <br>
  <ion-button class="transition">Edit User Information</ion-button>
  <br>
  <ion-button class="transition">Change Password</ion-button>
</ion-content>
