<ion-header>
  <ion-toolbar>
    <ion-title>Expenses Summary</ion-title>
    <!-- Side menu button -->
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content *ngFor="let i of expensesService.transactioncategories" class="ion-padding">
  <ion-text>Food: ${{ i.food }}</ion-text><br>
  <ion-text>Bills: ${{ i.bills }}</ion-text><br>
  <ion-text>Lifestyle: ${{ i.lifestyle }}</ion-text><br>
  <ion-text>Taxes: ${{ i.taxes }}</ion-text><br>
  <ion-text>Recurring fees: ${{ i.recurringfees }}</ion-text>
</ion-content>
